syntax = "proto3";
package compression;
    
service PromptCompressor {
  rpc Compress (CompressionRequest) returns (CompressionResponse);
}
    
message CompressionRequest {
   string prompt = 1;
   int32 max_tokens = 2;
   float compression_ratio = 3;
}
   
message CompressionResponse {
   int32 original_tokens = 1;
   int32 compressed_tokens = 2;
   string compressed_prompt = 3;
}